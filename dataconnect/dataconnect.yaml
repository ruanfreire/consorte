# Firebase Data Connect — alinhar instanceId/database com a consola (deploy exige plano Blaze + Cloud SQL).
# @see https://firebase.google.com/docs/data-connect/quickstart
specVersion: "v1alpha"
serviceId: "consorte-service"
location: "us-central1"
schema:
  source: "./schema"
  datasource:
    postgresql:
      database: "consorte-db"
      cloudSql:
        instanceId: "YOUR_CLOUD_SQL_INSTANCE_ID"
connectorDirs: ["./ana-connector"]
