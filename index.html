<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nossa História" />
    <meta name="format-detection" content="telephone=no" />

    <title>Nossa História 💛</title>
    <meta
      name="description"
      content="Uma história feita com carinho — entre, toque na tela e celebre esse dia especial com a gente."
    />
    <meta name="author" content="Consorte" />
    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="%CANONICAL_URL%" />
    <link rel="manifest" href="%ASSET_BASE%manifest.webmanifest" />
    <link rel="icon" type="%OG_IMAGE_TYPE%" href="%ASSET_BASE%og-cover.jpg" />
    <link rel="apple-touch-icon" href="%ASSET_BASE%og-cover.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant:ital,wght@0,500;0,600;0,700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph: WhatsApp, Facebook, LinkedIn, iMessage, Telegram, Slack, Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nossa História 💛" />
    <meta property="og:title" content="Nossa História 💛 — para você" />
    <meta
      property="og:description"
      content="Tem coisas que a gente só consegue dizer assim: com calma, com verdade e com muito amor. Entra e vê."
    />
    <meta property="og:url" content="%OG_URL%" />
    <meta property="og:image" content="%OG_IMAGE_URL%" />
    <meta property="og:image:secure_url" content="%OG_IMAGE_URL%" />
    <meta property="og:image:type" content="%OG_IMAGE_TYPE%" />
    <meta property="og:image:width" content="%OG_IMAGE_WIDTH%" />
    <meta property="og:image:height" content="%OG_IMAGE_HEIGHT%" />
    <meta property="og:image:alt" content="Nossa história — momento a momento" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter / X (Android, iOS, Web) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nossa História 💛 — para você" />
    <meta
      name="twitter:description"
      content="Tem coisas que a gente só consegue dizer assim: com calma, com verdade e com muito amor. Entra e vê."
    />
    <meta name="twitter:url" content="%OG_URL%" />
    <meta name="twitter:image" content="%OG_IMAGE_URL%" />
    <meta name="twitter:image:alt" content="Nossa história — momento a momento" />

    <!-- Microsoft / Windows / Android (tiles) -->
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-TileImage" content="%OG_IMAGE_URL%" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "%CANONICAL_URL%#website",
        "name": "Nossa História",
        "url": "%CANONICAL_URL%",
        "description": "Uma história feita com carinho — entre, toque na tela e celebre esse dia especial com a gente.",
        "inLanguage": "pt-BR",
        "image": {
          "@type": "ImageObject",
          "url": "%OG_IMAGE_URL%",
          "width": %OG_IMAGE_WIDTH%,
          "height": %OG_IMAGE_HEIGHT%
        }
      }
    </script>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100%;
        min-height: 100dvh;
        overflow: hidden;
        background: #000;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
      }
      #root {
        width: 100%;
        height: 100%;
        min-height: 100%;
        min-height: 100dvh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
